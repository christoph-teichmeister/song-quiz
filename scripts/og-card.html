<!doctype html><meta charset=utf-8>
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;overflow:hidden;background:radial-gradient(ellipse at 28% 35%,#3a2166,#14111c 70%);color:#f4f1fa;font-family:Figtree,sans-serif;position:relative}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;align-items:center;justify-content:space-between}
.l{display:flex;flex-direction:column;gap:26px;max-width:640px}
.icon{width:104px;height:104px;border-radius:26px;display:block}
h1{font:800 124px/.92 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.01em}
p{margin:0;font-size:38px;line-height:1.25;color:#a79fb8;font-weight:600}p b{color:#f4f1fa;font-weight:600}
.teams{display:flex;gap:16px;align-items:center;font:800 30px "Bricolage Grotesque",sans-serif}
.pill{padding:10px 26px;border-radius:40px;background:#241f31;border:3px solid}.A{color:#52d1ff;border-color:#52d1ff}.B{color:#ffb347;border-color:#ffb347}.vs{color:#a79fb8}
.buzz{width:400px;height:400px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8fb3,#ff4f8b 55%,#c4306a);box-shadow:0 22px 50px #0009,inset 0 -18px 40px #0003;display:flex;align-items:center;justify-content:center;font:800 78px "Bricolage Grotesque",sans-serif;color:#fff;letter-spacing:.03em;position:relative}
.buzz::before,.buzz::after{content:"";position:absolute;inset:-34px;border-radius:50%;border:3px solid #ff4f8b66}.buzz::after{inset:-74px;border-color:#ff4f8b33}
</style>
<div class=wrap><div class=l>
<h1>Song Quiz</h1>
<p><b>Erkennst du den Song?</b><br>Zwei Teams, ein Buzzer, ein Handy pro Person.</p>
<div class=teams><span class="pill A">Team A</span><span class=vs>vs</span><span class="pill B">Team B</span></div></div>
<div class=buzz>BUZZER</div></div>
