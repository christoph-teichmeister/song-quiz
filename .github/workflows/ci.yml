name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (logic, texts, script syntax)
        run: npm test
      - name: Browser tests (real pages, fake database, system Chrome)
        run: npm run e2e
        env:
          CHROME: /usr/bin/google-chrome
