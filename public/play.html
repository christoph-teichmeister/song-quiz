<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Song Quiz</title><link rel=icon type="image/svg+xml" href=/favicon.svg><link rel=manifest href=/manifest.webmanifest><link rel=apple-touch-icon href=/apple-touch-icon.png><meta name=theme-color content="#14111c"><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-capable content=yes>
<link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin>
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap">
<link rel=stylesheet href=style.css>
<div class=app id=main>Connecting…</div><div id=sticky></div><div id=modal></div>
<script type=module>
import { D, r, rr, ROOM } from './db.js';
import { awards } from './game.js';
import { RULES, MODE_RULE, rulesFor } from './rules.js';
import { qrSvg } from './qr.js';
import { auth, onUser, google, signIn, signUp, resetPw, signOut, removeAccount, authError } from './auth.js';
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const sim = qs.get('p'); // /sim opens several fake phones: ?p=Anna gives a fixed player id and name
const pid = sim ? 'sim-' + sim : (localStorage.sqPid ||= Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6));
let S = null, pub = { session: false, catalog: [] };
let cfg = { list: null, mode: 'normal', length: 10, custom: false }, modal = null, nameV = sim || localStorage.sqName || '', codeV = qs.get('code') || '';
let jt = false, ja = false, lastKey = '', lastVerify = '';
let user = null, sheet = null, authMsg = '', games = null, delConfirm = false, homeRoom = null, emailV = '', pwV = '', deferredInstall = null, installHint = '', lastModal = '';
const revealAt = {}; // when each reveal was first seen, so the countdown bar survives re-renders

const send = (o) => D.push(rr('actions'), { pid, ...o });
const act = (a) => send({ act: a });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const buzzNow = (el) => { navigator.vibrate?.(40); el.classList.add('fire'); act({ type: 'buzz' }); };
const MODES = {
  normal: ['Normal', 'The song plays until someone buzzes.'],
  intro: ['Intro only', 'Every song stops after 5 seconds. Only the intro counts, so buzz fast.'],
  speed: ['Speed', 'Buzz within the first 5 seconds and the points for that answer count double.'],
};
// handlers for inline onclick
Object.assign(window, {
  act, send,
  setName: (v) => { nameV = v; if (!sim) localStorage.sqName = v; },
  setCode: (v) => { codeV = v; },
  create: () => send({ create: nameV.trim() || 'Player' }),
  joinGame: () => send({ join: { code: (codeV || pub.code || '').trim(), name: nameV.trim() || 'Player' } }),
  pickList: (id) => { cfg.list = id; render(); },
  pickLen: (n) => { cfg.length = n; cfg.custom = false; render(); },
  pickCustom: () => { cfg.custom = true; render(); },
  stepLen: (d) => { cfg.length = Math.max(1, Math.min(50, cfg.length + d)); render(); },
  setLen: (v) => { const n = parseInt(v, 10); if (n > 0) cfg.length = Math.min(50, n); },
  pickMode: (m) => { cfg.mode = m; modal = m === 'normal' ? null : m; render(); },
  closeModal: () => { modal = null; render(); },
  start: () => act({ type: 'start', list: cfg.list || pub.catalog[0]?.id, mode: cfg.mode, length: cfg.length }),
  togJ: (k) => { if (k === 't') jt = !jt; else ja = !ja; render(); },
  confirmJ: () => act({ type: 'verify', title: jt, artist: ja }),
  buzzNow,
  openSheet: async (k) => { sheet = k; authMsg = ''; delConfirm = false; if (k === 'stats' && user) { games = null; render(); const sn = await D.get(r(`users/${user.uid}/games`)); games = Object.values(sn.val() || {}).sort((a, b) => b.ts - a.ts); } render(); },
  closeSheet: () => { sheet = null; render(); },
  setEmail: (v) => { emailV = v; }, setPw: (v) => { pwV = v; },
  doGoogle: async () => { try { await google(); sheet = null; } catch (e) { authMsg = authError(e); } render(); },
  doSignIn: async () => { try { await signIn(emailV.trim(), pwV); sheet = null; } catch (e) { authMsg = authError(e); } render(); },
  doSignUp: async () => { try { await signUp(emailV.trim(), pwV); sheet = null; } catch (e) { authMsg = authError(e); } render(); },
  doReset: async () => { try { await resetPw(emailV.trim()); authMsg = 'Reset email sent. Check your inbox.'; } catch (e) { authMsg = authError(e); } render(); },
  doSignOut: async () => { await signOut(); sheet = null; render(); },
  askDelete: (v) => { delConfirm = v; render(); },
  doDelete: async () => { try { await D.remove(r(`users/${user.uid}`)); await removeAccount(); sheet = null; } catch (e) { authMsg = authError(e); } render(); },
  hostHome: () => { homeRoom = Array.from(crypto.getRandomValues(new Uint8Array(10)), (b) => b.toString(16).padStart(2, '0')).join(''); D.set(r(`users/${user.uid}/rooms/${homeRoom}`), { created: Date.now() }); sheet = 'home'; render(); },
  copyLink: () => { navigator.clipboard?.writeText(location.origin + '/?room=' + homeRoom).then(() => { authMsg = 'Link copied.'; render(); }).catch(() => {}); },
  shareLink: () => { const url = location.origin + '/?room=' + homeRoom; if (navigator.share) navigator.share({ title: 'Song Quiz', text: 'Open this on the TV:', url }).catch(() => {}); else window.copyLink(); },
  goRoom: () => { location.href = '/play?room=' + homeRoom; },
  installApp: async () => { if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; } else installHint = 'On iPhone: tap Share, then “Add to Home Screen”. On Android: browser menu, then “Install app”.'; render(); },
});

D.onValue(rr('public'), (s) => { pub = s.val() || { session: false, catalog: [] }; render(); });
D.onValue(rr(`views/${pid}`), (s) => { S = s.val(); maybeSave(); render(); });
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; });
onUser((u) => { user = u; maybeSave(); render(); });
function maybeSave() { // each phone writes its own stats into its own account when a game ends (the rules only let the owner write)
  if (!user || !S || S.phase !== 'end' || !S.stats) return;
  const id = `${ROOM}-${S.code}-${S.game}`, me2 = S.stats.find((p) => p.id === S.me?.id);
  if (!me2 || localStorage['sqSaved:' + id]) return;
  localStorage['sqSaved:' + id] = '1';
  const a = S.teams.A.score, b = S.teams.B.score, mine = me2.team === 'A' ? a : b, other = me2.team === 'A' ? b : a;
  D.set(r(`users/${user.uid}/games/${id}`), { ts: Date.now(), room: ROOM, list: S.settings?.list ?? null, mode: S.settings?.mode ?? 'normal', songs: S.total, team: me2.team, A: a, B: b, result: mine > other ? 'win' : mine < other ? 'loss' : 'draw',
    pts: me2.pts, buzzes: me2.buzzes, right: me2.right, wrong: me2.wrong, avgMs: me2.avgMs ?? null, bestMs: me2.bestMs ?? null });
}
const live = () => S && S.me && pub.session && S.code === pub.code; // a view from an older game is ignored

function entry() {
  return { key: 'entry', body: `<div class=hdr><span></span><button class=score-pill style="border:0;color:inherit;cursor:pointer" onclick="openSheet('account')">${user ? '👤 ' + esc((user.displayName || user.email || 'Account').split(' ')[0]) : 'Sign in'}</button></div><h1>🎵 Song Quiz</h1><p class=hint style="text-align:left">Team up, buzz in, guess the song.</p>
    <div class=stack><input class=input id=name placeholder="Your name" maxlength=20 value="${esc(nameV)}" oninput="setName(this.value)" autocomplete=nickname>
    ${pub.session ? `<input class=input id=code placeholder="Game code" inputmode=numeric value="${esc(codeV || pub.code || '')}" oninput="setCode(this.value)"><button class=btn onclick="joinGame()">Join game</button>`
      : `<button class=btn onclick="create()">Create a new game</button>`}</div><p class=admin-link><a href="#" onclick="openSheet(\'rules\');return false">How to play</a></p>`, sticky: '' };
}

const ruleCards = (list) => `<div class=rules>${list.map((x) => `<div class=rule><i>${x.icon}</i><div><b>${x.title}</b><p>${x.text}</p></div></div>`).join('')}</div>`;
function sheetHtml() {
  const close = '<button class="btn ghost" onclick="closeSheet()">Close</button>', msg = authMsg ? `<p class=hint>${esc(authMsg)}</p>` : '';
  const sec = (ms) => (ms == null ? '–' : (ms / 1000).toFixed(1) + ' s');
  let inner = '';
  if (sheet === 'account' && !user) inner = `<h2>Sign in</h2><p>A free account lets you host your own games at home and keeps your stats.</p>
    <button class=btn onclick="doGoogle()">Continue with Google</button><p class=hint>or with email</p>
    <input class=input id=email type=email placeholder=Email value="${esc(emailV)}" oninput="setEmail(this.value)" autocomplete=email>
    <input class=input id=pw type=password placeholder=Password value="${esc(pwV)}" oninput="setPw(this.value)" autocomplete=current-password>
    <button class=btn onclick="doSignIn()">Sign in</button><button class="btn ghost" onclick="doSignUp()">Create account</button>
    <p class=hint><a href="#" onclick="doReset();return false" style="color:inherit">Forgot password?</a></p>${msg}
    <p class=hint style="font-size:.78rem">We store your email, name and your game stats. You can delete the account any time.</p>${close}`;
  else if (sheet === 'account') inner = `<h2>${esc(user.displayName || 'Your account')}</h2><p>${esc(user.email || '')}</p>
    <button class=btn onclick="hostHome()">🏠 Host a game at home</button><button class="btn ghost" onclick="openSheet('stats')">📊 My stats</button><button class="btn ghost" onclick="doSignOut()">Sign out</button>
    ${delConfirm ? `<p class=err>Delete your account and all saved stats?</p><button class=btn onclick="doDelete()">Yes, delete everything</button><button class="btn ghost" onclick="askDelete(false)">Cancel</button>` : `<button class="btn ghost" onclick="askDelete(true)">Delete my account</button>`}${msg}${close}`;
  else if (sheet === 'rules') inner = `<h2>How to play</h2>${ruleCards([...RULES, MODE_RULE.intro, MODE_RULE.speed])}${close}`;
  else if (sheet === 'home') { const link = location.origin + '/?room=' + homeRoom; inner = `<h2>Your home room</h2><p>Open this link in the browser of the TV or a laptop at home. Then create the game on your phone: friends scan the QR code that shows up on the TV.</p>
    <div class=card style="word-break:break-all;font-size:.9rem">${esc(link)}</div><div class=qrsvg style="width:150px;background:#fff;padding:8px;border-radius:12px;margin:auto">${qrSvg(link)}</div>
    <button class=btn onclick="copyLink()">Copy TV link</button><button class="btn ghost" onclick="shareLink()">Share link</button><button class="btn ghost" onclick="goRoom()">Open my room on this phone</button>${msg}${close}`; }
  else if (sheet === 'stats') {
    if (!games) inner = `<h2>My stats</h2><p>Loading…</p>${close}`;
    else if (!games.length) inner = `<h2>My stats</h2><p>No games saved yet. Play one while signed in and it shows up here.</p>${close}`;
    else { const n = games.length, sum = (k) => games.reduce((a, g) => a + (g[k] || 0), 0), wins = games.filter((g) => g.result === 'win').length, av = games.filter((g) => g.avgMs != null), best = games.filter((g) => g.bestMs != null);
      inner = `<h2>My stats</h2><div class=stat-grid><div><b>${n}</b><span>games</span></div><div><b>${wins}</b><span>wins</span></div><div><b>${sum('pts')}</b><span>points</span></div><div><b>${sum('right')}</b><span>right</span></div><div><b>${sec(av.length ? Math.round(av.reduce((a, g) => a + g.avgMs, 0) / av.length) : null)}</b><span>avg buzz</span></div><div><b>${sec(best.length ? Math.min(...best.map((g) => g.bestMs)) : null)}</b><span>fastest</span></div></div>
        <div class=label>Recent games</div>${games.slice(0, 8).map((g) => `<div class=card style="padding:10px 14px;font-size:.9rem">${new Date(g.ts).toLocaleDateString()} · ${esc(g.result)} · ${g.A}:${g.B} · ${g.pts} pts</div>`).join('')}${close}`; }
  }
  return inner ? `<div class=modal onclick="closeSheet()"><div class=sheet onclick="event.stopPropagation()">${inner}</div></div>` : '';
}

function render() {
  let v;
  if (!live()) v = entry(); else v = game();
  const enter = v.key !== lastKey; lastKey = v.key;
  $('main').className = 'app' + (enter ? ' enter' : '');
  $('main').innerHTML = v.body + (S?.err ? `<p class=err>${esc(S.err)}</p>` : '');
  $('sticky').innerHTML = v.sticky ? `<div class=sticky>${v.sticky}</div>` : '';
  const mh = sheet ? sheetHtml() : modal ? `<div class=modal onclick="closeModal()"><div onclick="event.stopPropagation()"><h2>${MODES[modal][0]}</h2><p>${MODES[modal][1]}</p><button class=btn onclick="closeModal()">Got it</button></div></div>` : '';
  const typing = document.activeElement?.tagName === 'INPUT' && $('modal').contains(document.activeElement); // only a focused input inside the sheet blocks the rebuild, buttons must be able to close it
  if (mh !== lastModal && !typing) { lastModal = mh; $('modal').innerHTML = mh; }
}

function game() {
  const me = S.me, t = me.team, ph = S.phase, mem = (x) => S.players.filter((p) => p.team === x);
  const isJudge = S.judge === me.id, front = t && S.teams[t].front === me.id, lk = (S.locked || []).includes(t);
  const hdr = `<div class=hdr><span><b>${esc(me.name)}</b> · ${t ? `<b class=${t}>Team ${t}</b>` : 'no team yet'}</span><span class=score-pill><span class=A>${S.teams.A.score}</span> : <span class=B>${S.teams.B.score}</span></span></div>`;
  const prog = S.total && !['lobby', 'end'].includes(ph) ? `<div class=prog><span>Song ${S.idx + 1} of ${S.total} · ${S.total - S.idx - 1 ? (S.total - S.idx - 1) + ' to go' : 'last song'}</span><div><i style="width:${100 * (S.idx + (ph === 'reveal' ? 1 : 0)) / S.total}%"></i></div></div>` : '';
  const judgeBanner = isJudge && ['countdown', 'playing'].includes(ph) ? `<div class=judge-banner>🎧 <b>You are the judge this song.</b> Listen along and keep the answer to yourself.</div>` : '';
  let body = '', sticky = '', key = ph;
  const hdrP = hdr + prog;

  if (ph === 'lobby') {
    const ready = mem('A').length > 0 && mem('B').length > 0;
    const card = (x) => `<button class="team-card ${x}${t === x ? ' on' : ''}" onclick="act({type:'team',team:'${x}'})"><h3 class=${x}>Team ${x}</h3><div class=chips>${mem(x).map((p) => `<span class=chip>${esc(p.name)}</span>`).join('') || '<span class=hint>nobody yet</span>'}</div><span class=join-pill>${t === x ? '✓ You are in' : t ? 'Tap to switch' : 'Tap to join'}</span></button>`;
    body = `${hdr}<div class=label>Game code ${esc(S.code)}</div><div class="step${t ? ' done' : ''}"><b>${t ? '✓' : 1}</b>Pick your team<small>tap a card</small></div><div class=team-cards>${card('A')}${card('B')}</div>`;
    if (S.host) {
      const cat = pub.catalog || [], sel = cfg.list || cat[0]?.id, custom = cfg.custom || ![5, 10, 15].includes(cfg.length);
      body += `<div class=step><b>2</b>Choose a playlist<small>tap one</small></div><div class=tiles>${cat.map((c) => `<button class="tile${c.id === sel ? ' on' : ''}" onclick="pickList('${c.id}')"><i>${c.emoji || '🎵'}</i><b>${esc(c.name)}</b><span>${c.count} songs</span></button>`).join('')}</div>
        <div class=step><b>3</b>Pick a mode<small>tap to change</small></div><div class=seg>${Object.entries(MODES).map(([k, m]) => `<button class="${cfg.mode === k ? 'on' : ''}" onclick="pickMode('${k}')">${m[0].split(' ')[0]}</button>`).join('')}</div>
        <div class=step><b>4</b>Number of songs<small>tap to change</small></div><div class=seg>${[5, 10, 15].map((n) => `<button class="${!custom && cfg.length === n ? 'on' : ''}" onclick="pickLen(${n})">${n}</button>`).join('')}<button class="${custom ? 'on' : ''}" onclick="pickCustom()">Custom</button></div>
        ${custom ? `<div class=stepper><button onclick="stepLen(-1)" aria-label="fewer">−</button><input class=input id=len type=number inputmode=numeric min=1 max=50 value="${cfg.length}" oninput="setLen(this.value)"><button onclick="stepLen(1)" aria-label="more">+</button></div>` : ''}`;
      sticky = `<button class=btn onclick="start()" ${t && ready ? '' : 'disabled'}>${!t ? 'Pick a team first' : ready ? 'Start game' : 'Each team needs a player'}</button>`;
    } else body += `<p class=hint>${t ? '' : 'Pick a team. '}The host starts the game <span class=dots><i></i><i></i><i></i></span></p>`;
  } else if (ph === 'howto') {
    const need = S.players.filter((q) => q.team), done = S.ack || [], mine = done.includes(me.id);
    body = `${hdr}<h2>How it works</h2>${ruleCards(rulesFor(S.settings.mode))}<p class=hint>${done.length} of ${need.length} ready</p>`;
    sticky = (t ? (mine ? `<button class=btn disabled>Waiting for the others…</button>` : `<button class=btn onclick="act({type:'ack'})">Got it, I understand</button>`) : '')
      + (S.host ? `<button class="btn ghost" onclick="act({type:'skiphowto'})">Start anyway</button>` : '');
  } else if (ph === 'pickfront' && t) {
    const fr = S.teams[t].front;
    body = `${hdrP}<h2>Who stands at the front?</h2><div class=stack>${mem(t).map((p) => `<button class="btn ghost${p.id === fr ? ' on' : ''}" onclick="act({type:'front',id:'${p.id}'})">${esc(p.name)}${p.id === fr ? ' 🎤' : ''}</button>`).join('')}</div>`;
    if (fr === me.id) sticky = `<button class=btn onclick="act({type:'ready'})" ${S.teams[t].ready ? 'disabled' : ''}>${S.teams[t].ready ? 'Waiting for the other team…' : 'Ready'}</button>`;
  } else if (ph === 'countdown') {
    body = `${hdrP}${judgeBanner}<h2 style="text-align:center;margin-top:6vh">Get ready<br><span class=dots><i></i><i></i><i></i></span></h2>${front ? '<p class=hint>You are the front-person. Buzz when you know it.</p>' : ''}`;
    key = 'countdown' + S.idx;
  } else if (ph === 'playing') {
    key = 'playing' + S.idx;
    body = `${hdrP}${judgeBanner}` + (front
      ? `<div class=center><button class=buzz id=buzz ${lk ? 'disabled' : ''} onclick="buzzNow(this)">${lk ? 'LOCKED' : 'BUZZ'}</button></div>`
      : `<div class=center><h2>${lk ? 'Your team is locked' : 'Listening…'}</h2><p class=hint>${lk ? 'The other team gets a try.' : 'Your front-person buzzes.'}</p></div>`);
  } else if (ph === 'verify') {
    const vk = S.idx + ':' + S.buzz.at; if (vk !== lastVerify) { lastVerify = vk; jt = ja = false; }
    if (isJudge || (!S.judge && t && t !== S.buzz.team)) {
      body = `${hdrP}<div class=judge-banner>🎧 <b>You are the judge.</b> Team ${S.buzz.team} buzzed. Is their answer right?</div>
        <div class=card><div class=answer>${esc(S.answer.title)}<small>${esc(S.answer.artist)}</small></div></div>
        <div class=stack><button class="tog${jt ? ' on' : ''}" onclick="togJ('t')">Title correct <em>${jt ? '✓' : '✗'}</em></button><button class="tog${ja ? ' on' : ''}" onclick="togJ('a')">Artist correct <em>${ja ? '✓' : '✗'}</em></button></div>`;
      sticky = `<button class=btn onclick="confirmJ()">Confirm</button>`;
    } else body = `${hdrP}<h2 style="text-align:center;margin-top:6vh"><span class=${S.buzz.team}>Team ${S.buzz.team}</span> buzzed</h2><p class=hint>${S.judgeName ? esc(S.judgeName) + ' is judging' : 'Say your answer out loud'} <span class=dots><i></i><i></i><i></i></span></p>`;
    key = 'verify' + vk;
  } else if (ph === 'reveal') {
    const lr = S.lastResult;
    const nx = S.next, upNext = nx && (nx.A === me.id || nx.B === me.id), judgeNext = nx && nx.judge === me.id;
    const nextNote = upNext ? `<div class=judge-banner>🎤 <b>You are the next guesser.</b> Get to the front and buzz for Team ${t}.</div>` : judgeNext ? `<div class=judge-banner>🎧 <b>You are the next judge.</b> You will see the answer, keep it to yourself.</div>` : '';
    const rs = (revealAt[S.idx] ||= Date.now()), el = Math.min(Date.now() - rs, 10000);
    const cdp = nx ? `<div class=cdp><span>Next song starts soon</span><div><i style="animation-duration:10000ms;animation-delay:-${el}ms"></i></div></div>` : '';
    body = `${hdrP}${nextNote}${cdp}<div class=card><div class=answer>${esc(S.answer.title)}<small>${esc(S.answer.artist)}</small></div></div>${lr ? `<p class=hint><b class=${lr.team}>Team ${lr.team}</b> ${lr.pts ? `+${lr.pts}` : 'no points'}</p>` : ''}<p class=hint>${nx ? '' : 'That was the last song…'}</p>`;
  } else if (ph === 'end') {
    const w = S.teams.A.score === S.teams.B.score ? 'It\'s a draw' : `Team ${S.teams.A.score > S.teams.B.score ? 'A' : 'B'} wins`;
    const me2 = (S.stats || []).find((p) => p.id === me.id), aw = awards(S.stats || [])[me.id] || [];
    const sec = (ms) => (ms == null ? '–' : (ms / 1000).toFixed(1) + ' s');
    body = `${hdr}<h1>${w} ${S.teams.A.score === S.teams.B.score ? '🤝' : '🎉'}</h1><div class=card><b class=A>Team A</b> ${S.teams.A.score} · <b class=B>Team B</b> ${S.teams.B.score}</div>` + (me2 ? `<div class=label>Your game</div>${aw.length ? `<div class=chips>${aw.map((l) => `<span class=chip>${l}</span>`).join('')}</div>` : ''}
      <div class=stat-grid><div><b>${me2.pts}</b><span>points</span></div><div><b>${me2.buzzes}</b><span>buzzes</span></div><div><b>${me2.right}</b><span>right</span></div><div><b>${me2.wrong}</b><span>wrong</span></div><div><b>${sec(me2.avgMs)}</b><span>avg buzz</span></div><div><b>${sec(me2.bestMs)}</b><span>fastest</span></div></div>` : '<p class=hint>You were the judge or listened this game, no stats for you.</p>');
    const standalone = matchMedia('(display-mode: standalone)').matches;
    body += user ? `<p class=hint>✓ Your stats are saved to your account.</p>` : `<div class=card><b>Liked it?</b><p style="margin:.4em 0 .8em;color:var(--mute)">Install the app and create a free account: host your own games at home, send the TV link to friends and keep your stats.</p><div class=stack>${standalone ? '' : '<button class="btn ghost" onclick="installApp()">Install the app</button>'}<button class=btn onclick="openSheet(\'account\')">Create a free account</button></div>${installHint ? `<p class=hint>${esc(installHint)}</p>` : ''}</div>`;
    if (S.host) sticky = `<button class=btn onclick="act({type:'again'})">Play again</button>`;
  } else body = hdr;
  const tvWarn = pub.tvHidden && S.host && ph !== 'end' ? '<div class=judge-banner style="border-color:var(--bad);background:#ff6b6b1a">📺 <b>The TV tab is in the background.</b> Bring it to the front, otherwise the game can freeze.</div>' : '';
  return { key, body: tvWarn + body, sticky };
}
render();
