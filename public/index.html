<!doctype html><script>document.documentElement.className='gated'</script><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Song Quiz TV</title><meta name=description content="Song Quiz: zwei Teams, ein Buzzer, ein Handy pro Person. Erkennst du den Song?"><meta property=og:type content=website><meta property=og:title content="Song Quiz"><meta property=og:description content="Zwei Teams, ein Buzzer, ein Handy pro Person. Erkennst du den Song?"><meta property=og:image content="https://songs.teichmeister.lu/og.png"><meta property=og:image:width content=1200><meta property=og:image:height content=630><meta name=twitter:card content=summary_large_image><link rel=icon type="image/svg+xml" href=/favicon.svg>

<script type=module>
import { createSession, join, act, tick, view, awards, T } from './game.js';
import { D, rr, ROOM, db } from './db.js';
import { qrSvg } from './qr.js';
import { RULES, rulesFor } from './rules.js';
import { t, getLang, setLang } from './i18n.js';
import { disc } from './disc.js';
import { pictos } from './pictos.js';
import { PICTO } from './rules.js';
const REPO = 'https://github.com/christoph-teichmeister/song-quiz';

// The TV page is the game server: it owns the state, phones only send actions and show their own view.
const $ = (id) => document.getElementById(id);
let session = null, S = null, lists = {}, errs = {}, last = {}, yt = null, ytReady = false, unlocked = false, lastIdx = -1, wasPaused = false;
const now = () => Date.now();
const tvNow = () => session?.paused?.at ?? now(); // a paused screen shows frozen countdowns
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); // player names go into innerHTML
let AC; // Web Audio for the end-screen sounds (synthesised, no files)
const ac = () => (AC ||= new (window.AudioContext || window.webkitAudioContext)());
function applause() { // a real recording (public domain); the synthesised version below is the fallback
  const a = new Audio('/sounds/applause.ogg'); a.volume = .85;
  a.play().then(() => setTimeout(() => { const f = setInterval(() => { a.volume = Math.max(0, a.volume - .08); if (a.volume <= 0) { clearInterval(f); a.pause(); } }, 150); }, 8200)).catch(() => applauseSynth());
}
function applauseSynth() { // many short filtered noise bursts, densest in the middle
  const c = ac(), t0 = c.currentTime + .05;
  for (let i = 0; i < 130; i++) {
    const t = t0 + (Math.random() + Math.random()) / 2 * 3.8, len = .035 + Math.random() * .03;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * len), c.sampleRate), d = buf.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * Math.exp(-k / (d.length * .25));
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1200 + Math.random() * 2600; f.Q.value = .7;
    const g = c.createGain(); g.gain.value = .35 + Math.random() * .45;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
  }
}
function sadTrombone() { // wah wah wah wahhh
  const c = ac(); let t = c.currentTime + .05;
  [[233, .42], [220, .42], [208, .42], [196, 1.3]].forEach(([hz, dur], i, a) => {
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(), last = i === a.length - 1;
    o.type = 'sawtooth'; o.frequency.setValueAtTime(hz, t);
    if (last) { o.frequency.linearRampToValueAtTime(hz * .94, t + dur); const v = c.createOscillator(), vg = c.createGain(); v.frequency.value = 5.5; vg.gain.value = 4; v.connect(vg); vg.connect(o.frequency); v.start(t); v.stop(t + dur); }
    f.type = 'lowpass'; f.frequency.setValueAtTime(500, t); f.frequency.linearRampToValueAtTime(1100, t + dur * .35); f.frequency.linearRampToValueAtTime(450, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t + .05); g.gain.setValueAtTime(.22, t + dur - .08); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(f); f.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .02); t += dur + .04;
  });
}
function bzzt() { // short low buzzer: two detuned square waves through a lowpass
  const c = ac(), t = c.currentTime + .02, g = c.createGain(), f = c.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 900;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .02); g.gain.setValueAtTime(.12, t + .26); g.gain.linearRampToValueAtTime(0, t + .3);
  [110, 116].forEach((hz) => { const o = c.createOscillator(); o.type = 'square'; o.frequency.value = hz; o.connect(f); o.start(t); o.stop(t + .32); });
  f.connect(g); g.connect(c.destination);
}
let prevPh, flashTimer; // prevPh stays undefined until the first state is seen, so a reload mid-verify does not flash
function buzzFx(team) {
  const el = $('flash'); el.dataset.team = team; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  clearTimeout(flashTimer); flashTimer = setTimeout(() => el.classList.remove('on'), 700);
  if (unlocked) try { bzzt(); } catch {}
}
function drawFx() { // a draw: equal numbers of blue and orange bubbles drift up and meet in the middle
  const cv = $('confetti'), g = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const ps = Array.from({ length: 60 }, (_, i) => ({ x: innerWidth * (.15 + Math.random() * .7), y: innerHeight + Math.random() * innerHeight * .5, r: 10 + Math.random() * 26, vy: -(1.2 + Math.random() * 2), sway: Math.random() * 6, c: i % 2 ? '#52d1ff' : '#ffb347' }));
  const t0 = performance.now();
  (function frame(t) {
    g.clearRect(0, 0, cv.width, cv.height);
    for (const q of ps) { q.y += q.vy; const x = q.x + Math.sin(t / 700 + q.sway) * 30; g.globalAlpha = Math.max(0, .55 * (1 - (t - t0) / 7000)); g.fillStyle = q.c; g.beginPath(); g.arc(x, q.y, q.r, 0, 7); g.fill(); }
    if (t - t0 < 7000) requestAnimationFrame(frame); else g.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}
window.onYouTubeIframeAPIReady = () => { yt = new YT.Player('yt', { width: 320, height: 200, playerVars: { playsinline: 1, controls: 0 }, events: { onReady: () => { ytReady = true; audio(); }, onStateChange: (e) => { if (e.data === 0 && idleOn) ambient(); if (e.data === 0 && !idleOn) songOver(); setNp(idleOn ? ({ 1: '♪ ' + (yt.getVideoData?.().title || ''), 3: t('tv.loading'), '-1': t('tv.starting'), 2: t('tv.paused') }[e.data] ?? '') : ''); }, onError: (e) => { if (idleOn) return ambient(); console.error('SQ yt error', e.data); songOver(e.data); } } }); };

// The song ran out or the video is broken while nobody buzzed: the host's skip moves the game on to the reveal.
let videoErr = ''; // shown on the cover for a moment before the game moves on
function songOver(err) {
  if (!session || session.phase !== 'playing') return;
  if (err != null) { videoErr = t('tv.videoErr', { n: err }); setTimeout(() => { videoErr = ''; skipNow(); }, 2500); } else skipNow();
}
function skipNow() { // a video event during a pause waits until the host resumes
  if (session?.phase !== 'playing') return;
  if (session.paused) return void setTimeout(skipNow, 1000);
  handle({ pid: session.hostId, act: { type: 'skip' } });
}

window.unlock = () => { if (unlocked) return; unlocked = true; document.documentElement.classList.remove('gated'); $('snd').classList.add('out'); setTimeout(() => { $('snd').style.display = 'none'; }, 700); try { ac().resume(); audio(); } catch {} wakeLock(); };
let wl = null; // keep the TV screen on for the whole evening
async function wakeLock() { try { if (!wl && navigator.wakeLock) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && unlocked) wakeLock(); });
window.toggleLang = () => { setLang(getLang() === 'de' ? 'en' : 'de'); lastHtml = ''; $('main').dataset.k = ''; texts(); render(); };
function texts() { $('gate-b').textContent = t('tv.gate'); $('gate-p').textContent = t('tv.gateP'); $('npb').title = t('tv.musicTitle'); $('lang').innerHTML = getLang() === 'de' ? '<b>DE</b> · EN' : 'DE · <b>EN</b>'; }
texts();
addEventListener('click', () => { if (!unlocked) window.unlock(); }); addEventListener('keydown', () => { if (!unlocked) window.unlock(); });
if (window.YT?.Player) window.onYouTubeIframeAPIReady(); // the API script may have loaded before this module ran
if (new URLSearchParams(location.search).has('fast')) Object.assign(T, { countdown: 300, reveal: 1500 }); // browser tests: short pauses
if (new URLSearchParams(location.search).has('new')) localStorage.sqState = ''; // /?new starts clean
try { const saved = JSON.parse(localStorage.sqState || 'null'); if (saved) session = saved; } catch {} // resume after a TV reload

// Only one TV page may host: a second one would run its own game on the same database.
const myId = Math.random().toString(36).slice(2);
const seen = (await D.get(rr('host'))).val();
if (seen) {
  await new Promise((ok) => setTimeout(ok, 2500)); // a live host rewrites its heartbeat every second
  const again = (await D.get(rr('host'))).val();
  if (again && again.ts !== seen.ts) {
    document.body.innerHTML = `<div class=tv><h1>${t('tv.another')}</h1><p>${t('tv.anotherP')}</p></div>`;
    throw new Error('second TV page');
  }
}
const beat = () => { D.set(rr('host'), { id: myId, ts: Date.now() }); D.set(D.ref(db, `roomIndex/${ROOM}`), { ts: Date.now() }); };
beat(); setInterval(beat, 1000);
// Firebase says false until it has connected: only a gap of 3 s counts as offline
let offTimer = 0;
D.onValue(D.ref(db, '.info/connected'), (sn) => {
  if (sn.val()) { clearTimeout(offTimer); offTimer = 0; $('off').hidden = true; }
  else if (!offTimer) offTimer = setTimeout(() => { $('off').hidden = false; }, 3000);
});
D.onValue(rr('host'), (sn) => { if (sn.val() && sn.val().id !== myId) location.reload(); }); // someone took over: show the notice
let epoch0; // admin kill: /admin/epoch changes only through the admin page (rules check the key)
D.onValue(rr('admin/epoch'), (sn) => {
  const v = sn.val() ?? 0;
  if (epoch0 === undefined) { epoch0 = v; return; }
  if (v === epoch0) return;
  epoch0 = v; session = null; localStorage.sqState = ''; errs = {};
  D.remove(rr('views')); D.remove(rr('actions')); for (const k of Object.keys(last)) if (k.startsWith('views/')) delete last[k];
  publish();
});

const catalog = await (await fetch('songs/index.json')).json(); // [{id, name, emoji}], in display order
for (const c of catalog) lists[c.id] = await (await fetch(`songs/${c.id}.json`)).json();
await D.remove(rr('actions')); // stale phone actions from before this page load
if (!session) await D.remove(rr('views')); // stale views of earlier games

D.onChildAdded(rr('actions'), (snap) => { D.remove(snap.ref); handle(snap.val()); });

function handle(m) {
  if (!m?.pid) return;
  if (m.create && !session) session = createSession(m.create, now(), m.pid);
  else if (m.join && session && m.join.code === session.code && !session.players[m.pid]) join(session, m.join.name, now(), m.pid);
  else if (m.act && session?.players[m.pid]) {
    const a = m.act;
    if (a.type === 'start') a.songs = a.list === 'random' ? randomPool() : lists[a.list]; // never trust the phone's song list
    const err = act(session, m.pid, a, now());
    if (err) { errs[m.pid] = err; setTimeout(() => { delete errs[m.pid]; publish(); }, 2500); }
  }
  publish();
}

// "Random": songs of every playlist mixed (the quiet ambient music stays out)
function randomPool() { const seen = new Set(); return Object.entries(lists).filter(([id]) => id !== 'ambient-sound-system').flatMap(([, l]) => l).filter((s) => !seen.has(s.id) && seen.add(s.id)); }

function put(path, val) { // write only what changed
  const j = JSON.stringify(val ?? null);
  if (last[path] === j) return;
  last[path] = j;
  D.set(rr(path), JSON.parse(j)).catch((e) => console.error('SQ db write', path, e.message)); // round-trip: Firebase rejects undefined values
}
function publish() {
  try { publish2(); } catch (e) { console.error('SQ publish', e.stack || e.message); }
}
function publish2() {
  put('public', { tvHidden: document.hidden, session: !!session, code: session?.code ?? null, summary: session ? { phase: session.phase, idx: session.idx, total: session.songs.length, list: session.settings.list, mode: session.settings.mode, scores: { A: session.teams.A.score, B: session.teams.B.score }, players: Object.values(session.players).map((p) => ({ name: p.name, team: p.team })) } : null, catalog: [{ id: 'random', name: 'Random', de: 'Zufall', emoji: '🎲', count: randomPool().length }, ...catalog.map((c) => ({ ...c, count: lists[c.id].length }))] });
  if (!session && Object.keys(last).some((k) => k.startsWith('views/'))) { // game ended: wipe all views
    for (const k of Object.keys(last)) if (k.startsWith('views/')) delete last[k];
    D.remove(rr('views'));
  }
  const ids = new Set(Object.keys(session?.players ?? {}));
  for (const k of Object.keys(last)) if (k.startsWith('views/') && !ids.has(k.slice(6))) put(k, null);
  for (const id of ids) put(`views/${id}`, { ...view(session, id), err: errs[id] ?? null });
  localStorage.sqState = session ? JSON.stringify(session) : '';
  S = session ? view(session, 'tv') : null;
  render(); audio();
}

const heartbeat = () => {
  if (session && tick(session, now()) === 'reset') session = null;
  publish();
};
// A Web Worker keeps ticking at full speed when the tab is in the background (page timers get throttled to once a minute there)
try {
  const w = new Worker(URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 500)'], { type: 'text/javascript' })));
  w.onmessage = heartbeat;
} catch { setInterval(heartbeat, 500); }
document.addEventListener('visibilitychange', () => { heartbeat(); }); // catch up and tell the phones whether the TV tab is hidden

window.keepAlive = () => { if (session) { session.lastActivity = now(); session.promptUntil = 0; publish(); } };

const q = (url) => `<div class=qrsvg>${qrSvg(url)}</div>`;
const base = location.origin, rq = ROOM === 'main' ? '' : 'room=' + ROOM;
const fr = (t) => esc(S.players.find((p) => p.id === S.teams[t].front)?.name) || '–';
const matchup = () => `<div class=matchup><div class="mu A"><small>Team A</small><b>${fr('A')}</b><span>${t('tv.atBuzzer')}</span></div><div class=vs>vs</div><div class="mu B"><small>Team B</small><b>${fr('B')}</b><span>${t('tv.atBuzzer')}</span></div></div>`;
const cd = () => { const left = Math.max(0, S.until - tvNow()); return `<div class=cd><span>${t('tv.nextIn', { n: Math.ceil(left / 1000) })}</span><div><i style="animation-duration:${T.reveal}ms;animation-delay:-${T.reveal - left}ms"></i></div></div>`; };
const AW = { pts: '🏆', fast: '⚡', sharp: '🎯' };
const sec = (ms) => (ms == null ? '–' : (ms / 1000).toFixed(1) + ' s');
function chart(tl) { // score after every song, one line per team
  const W = 620, H = 280, P = 40, n = Math.max(1, tl.length - 1), max = Math.max(1, ...tl.flatMap((p) => [p.A, p.B]));
  const x = (i) => P + (W - 2 * P) * i / n, y = (v) => H - P - (H - 2 * P) * v / max;
  const line = (k, c) => `<polyline fill=none stroke="${c}" stroke-width=4 stroke-linejoin=round points="${tl.map((p, i) => `${x(i)},${y(p[k])}`).join(' ')}"/>${tl.map((p, i) => `<circle cx=${x(i)} cy=${y(p[k])} r=5 fill="${c}"/>`).join('')}`;
  return `<svg viewBox="0 0 ${W} ${H}" class=chart><line x1=${P} y1=${y(0)} x2=${W - P} y2=${y(0)} stroke="#3a3348"/><line x1=${P} y1=${y(max)} x2=${W - P} y2=${y(max)} stroke="#3a3348" stroke-dasharray="4 6"/>
    <text x=${P - 8} y=${y(max) + 5} text-anchor=end fill="#a79fb8" font-size=16>${max}</text><text x=${P - 8} y=${y(0) + 5} text-anchor=end fill="#a79fb8" font-size=16>0</text>
    <text x=${P} y=${H - 10} fill="#a79fb8" font-size=16>${t('tv.start')}</text><text x=${W - P} y=${H - 10} text-anchor=end fill="#a79fb8" font-size=16>${t('tv.song', { n })}</text>${line('A', '#52d1ff')}${line('B', '#ffb347')}</svg>`;
}
function statsTable() {
  const aw = awards(S.stats), rows = [...S.stats].sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name));
  return `<table class=stats><tr><th></th><th>${t('buzzes')}</th><th>${t('right')}</th><th>${t('wrong')}</th><th>${t('points')}</th><th>Ø</th><th>${t('fastest')}</th></tr>${rows.map((p) => `<tr><td class=${p.team}>${esc(p.name)} ${(aw[p.id] || []).map((c) => AW[c]).join('')}</td><td>${p.buzzes}</td><td>${p.right}</td><td>${p.wrong}</td><td><b>${p.pts}</b></td><td>${sec(p.avgMs)}</td><td>${sec(p.bestMs)}</td></tr>`).join('')}</table>
    <p class=legend>${t('tv.legend')}</p>`;
}
function names(t) { return S.players.filter((p) => p.team === t).map((p) => esc(p.name) + (S.teams[t].front === p.id && S.phase !== 'lobby' ? ' 🎤' : '')).join(', ') || '–'; }

function render() {
  if (S) { if (prevPh !== undefined && prevPh !== 'verify' && S.phase === 'verify' && !S.paused) buzzFx(S.buzz.team); prevPh = S.phase; }

  document.body.classList.toggle('paused', !!S?.paused); // freezes the CSS countdown bars

  const prompt = S && S.promptUntil; $('prompt').style.display = prompt ? 'flex' : 'none';
  if (prompt) $('prompt').innerHTML = t('tv.prompt', { n: Math.max(0, Math.ceil((S.promptUntil - now()) / 1000)) });
  const inGame = S && ['pickfront', 'countdown', 'playing', 'verify', 'reveal'].includes(S.phase) && S.total;
  $('prog').style.display = inGame ? 'block' : 'none';
  if (inGame) { const left = S.total - S.idx - 1; $('progt').textContent = `${t('songOf', { n: S.idx + 1, m: S.total })} · ${left ? t('toGo', { n: left }) : t('lastSong')}`; $('progf').style.width = (100 * (S.idx + (S.phase === 'reveal' ? 1 : 0)) / S.total) + '%'; }

  <div class=hero><div class=rings><i></i><i></i><i></i>${disc()}</div><h1 class=ink data-t="Song Quiz">Song Quiz</h1>
  <ol class=steps><li><b>1</b><span>${t('tv.step1')}</span></li><li><b>2</b><span>${t('tv.step2')}</span></li><li><b>3</b><span>${t('tv.step3')}</span></li></ol><div class=tip id=tip></div></div>
  <div class=scan><div class=qrcard>${q(base + '/play' + (rq ? '?' + rq : ''))}</div><p>${t('tv.scan')}</p></div>
  <a class=repo href="${REPO}" target=_blank><div class=qrsvg>${qrSvg(REPO)}</div><span>GitHub</span></a></div>`;
    tipTick();
    return;
  }
  $('main').dataset.k = '';
  const sc = `<div class=row><div class="tcard A"><div class=A>Team A</div><div class=score>${S.teams.A.score}</div>${names('A')}</div><div class="tcard B"><div class=B>Team B</div><div class=score>${S.teams.B.score}</div>${names('B')}</div></div>`;
  const ph = S.phase; let h = '';
  if (ph === 'lobby') h = `<h1>${t('tv.join', { code: S.code })}</h1><div class=qrcard style="width:min(30vw,380px);margin:auto">${q(base + '/play?code=' + S.code + (rq ? '&' + rq : ''))}</div>${sc}<p>${t('tv.hostPicks')}</p>`;
  else if (ph === 'howto') { const need = S.players.filter((p) => p.team), ok = S.ack || []; h = `<h1>${t('tv.howto')}</h1><div class=rulegrid>${rulesFor(S.settings.mode).map((x) => `<div class=rule><i>${x.key && PICTO[x.key] ? pictos[PICTO[x.key]] : x.icon}</i><div><b>${x.title}</b><p>${x.text}</p></div></div>`).join('')}</div><div class=ackbar>${need.map((p) => `<span class="ack ${p.team}${ok.includes(p.id) ? ' ok' : ''}">${ok.includes(p.id) ? '✓' : '⏳'} ${esc(p.name)}</span>`).join('')}</div><h2>${t('tv.allReady', { n: ok.length, m: need.length })}</h2>`; }
  else if (ph === 'pickfront') h = `<h1>${t('tv.pickFront', { n: S.idx + 1, m: S.total })}</h1>${sc}<p>${t('tv.frontReady')}</p>`;
  else if (ph === 'countdown') h = `<h2>${t('tv.songOf', { n: S.idx + 1, m: S.total })}</h2>${matchup()}<div class="big sm">${Math.max(1, Math.ceil((S.until - tvNow()) / 1000))}</div>${S.judgeName ? `<div class=judge-pill>${t('tv.judge', { name: esc(S.judgeName) })}</div>` : ''}`;
  else if (ph === 'playing') { $('cover-t').textContent = videoErr || `${t('tv.songOf', { n: S.idx + 1, m: S.total })}${S.locked.length ? ' — ' + t('tv.locked', { teams: S.locked.map((x) => t('team') + ' ' + x).join(', ') }) : ''}`; $('cover-s').innerHTML = matchup(); }
  else if (ph === 'verify') { const left = Math.max(0, Math.ceil((S.buzz.until - tvNow()) / 1000)); $('cover-t').innerHTML = `<span class=${S.buzz.team}>${t('team')} ${S.buzz.team}</span> ${t('tv.buzzed')}${S.judgeName ? `<br><small>${t('tv.judges', { name: esc(S.judgeName) })}</small>` : ''}<br><small>${left ? t('tv.answerTime', { n: left }) : t('talkOver')}</small>`; $('cover-s').innerHTML = matchup(); }
  else if (ph === 'reveal') h = `${S.next ? cd() : ''}<h1>${S.answer.title}</h1><h2>${S.answer.artist}</h2>${S.lastResult ? `<p>${t('team')} ${S.lastResult.team}: +${S.lastResult.pts}</p>` : `<p>${t('tv.nobodyGotIt')}</p>`}${S.next ? `<h2>${t('tv.nextUp')}: <span class=A>${esc(S.next.names.A)}</span> (A) · <span class=B>${esc(S.next.names.B)}</span> (B)${S.next.names.judge ? ` · ${t('tv.judges', { name: esc(S.next.names.judge) })}` : ''}</h2>` : ''}${sc}`;
  else if (ph === 'end') { const w = S.teams.A.score === S.teams.B.score ? t('tv.draw') : t('tv.wins', { team: S.teams.A.score > S.teams.B.score ? 'A' : 'B' }); h = `<h1>${w}</h1><div class=endscore><span class=A>Team A <b>${S.teams.A.score}</b></span> : <span class=B><b>${S.teams.B.score}</b> Team B</span></div><div class=endgrid><div class=panel><h3>${t('tv.scoreTime')}</h3>${S.timeline ? chart(S.timeline) : ''}</div><div class=panel><h3>${t('tv.players')}</h3>${S.stats ? statsTable() : ''}</div></div><p class=again>${t('tv.again')}</p>`; }
  if (lastHtml !== h) { lastHtml = h; $('main').innerHTML = h; } // only touch the DOM on change so animations do not restart every tick
  if (ph === 'end' && !confettiDone) { confettiDone = true; const draw = S.teams.A.score === S.teams.B.score; if (unlocked) try { draw ? sadTrombone() : applause(); } catch {} draw ? drawFx() : confetti(); } else if (ph !== 'end') confettiDone = false;
}

let lastHtml = '', confettiDone = false, tipI = Math.floor(Math.random() * 5);
function tipTick(next) { // the start page cycles through the rules, one short card at a time
  const el = $('tip'); if (!el) return;
  if (next) tipI++;
  const R = RULES(), i = tipI % R.length, x = R[i]; el.innerHTML = `<div class=tipcard><div class=tp>${pictos[PICTO[x.key]]}</div><div><div class=th style="color:${x.color}">${x.title}</div><div class=tt>${x.text}</div><div class=tdots>${R.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div></div></div>`; el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
}
setInterval(() => tipTick(true), 8000);
function confetti() { // one short burst at the end of a game
  const cv = $('confetti'), g = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ff4f8b', '#52d1ff', '#ffb347', '#5ee6a0', '#f4f1fa'];
  const ps = Array.from({ length: 170 }, () => ({ x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 26, vy: -Math.random() * 22 - 4, w: 8 + Math.random() * 8, h: 5 + Math.random() * 6, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    g.clearRect(0, 0, cv.width, cv.height);
    for (const q of ps) { q.vy += .55; q.x += q.vx; q.y += q.vy; q.vx *= .99; q.a += q.va; g.save(); g.translate(q.x, q.y); g.rotate(q.a); g.fillStyle = q.c; g.globalAlpha = Math.max(0, 1 - (t - t0) / 5000); g.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); g.restore(); }
    if (t - t0 < 5000) requestAnimationFrame(frame); else g.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}
let musicOn = localStorage.sqMusic !== 'off';
function setNp(txt) { $('npt').textContent = txt; $('npb').textContent = musicOn ? '🔊' : '🔇'; $('np').style.display = (!S || S.phase === 'lobby') ? 'flex' : 'none'; }
window.toggleMusic = () => {
  musicOn = !musicOn; localStorage.sqMusic = musicOn ? 'on' : 'off';
  if (!musicOn && idleOn) { idleOn = false; yt.stopVideo(); }
  setNp(musicOn ? '' : t('tv.musicOff')); if (musicOn) audio();
};
let idleOn = false; // quiet background music on the start page and in the lobby
function ambient() {
  const all = Object.values(lists).flat();
  if (!musicOn) return;
  if (!all.length) return;
  setNp(t('tv.starting')); yt.setVolume(25); yt.loadVideoById(all[Math.floor(Math.random() * all.length)].id); idleOn = true;
}

function audio() {
  if (!ytReady) return;
  if (S?.paused) { yt.pauseVideo(); wasPaused = true; return; }
  if (wasPaused) { wasPaused = false; if (S?.phase === 'reveal' && S.settings.mode !== 'intro') yt.playVideo(); } // the reveal lets the song run on
  if (!S || S.phase === 'lobby') { if (unlocked && musicOn && !idleOn) ambient(); return; }
  if (idleOn) { idleOn = false; yt.setVolume(100); lastIdx = -1; }
  const p = S.phase;
  if (p === 'playing') { if (S.idx !== lastIdx || !yt.getVideoData?.().video_id) { lastIdx = S.idx; yt.loadVideoById(S.videoId); } else yt.playVideo(); }
  else if (p === 'verify' || (p === 'reveal' && S.settings.mode === 'intro')) yt.pauseVideo();
  else if (p === 'end' || p === 'pickfront') { yt.stopVideo(); lastIdx = -1; }
}
</script>
