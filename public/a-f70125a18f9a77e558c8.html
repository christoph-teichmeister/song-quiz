<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Song Quiz Admin</title>
<link rel=icon type="image/svg+xml" href=/favicon.svg><meta name=robots content=noindex>
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap">
<link rel=stylesheet href=style.css>
<style>
#main{max-width:1100px;margin:0 auto;padding:16px;display:block}
h1{font-size:1.4rem;margin:0}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px}
.tabs button{padding:8px 16px;border-radius:9px;color:var(--mute);font-weight:600}.tabs .on{background:var(--bg2);color:var(--fg)}
.badge{background:var(--ok);color:#06210f;border-radius:10px;padding:0 7px;font-size:.78rem}
.acct{margin-left:auto;position:relative}.acct summary{cursor:pointer;color:var(--mute);font-size:.9rem;list-style:none}.acct .card{position:absolute;right:0;top:28px;z-index:5;white-space:nowrap}
.split{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.side,.detail{display:flex;flex-direction:column;gap:12px;min-width:0}
.plist{display:flex;flex-direction:column;gap:4px}
.pi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;text-align:left;background:var(--card)}.pi.on{background:#ff4f8b22;box-shadow:inset 0 0 0 2px var(--hot)}
.pi .nm{flex:1;min-width:0}.pi i{font-size:.7rem;color:var(--mute);font-style:normal;border:1px solid var(--line);border-radius:6px;padding:0 5px}.pi .ct{color:var(--mute);font-size:.85rem}
.newl{background:var(--card);border-radius:12px;padding:10px 12px}.newl summary{cursor:pointer;font-weight:600}.newl .col{margin-top:10px}
.col{display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.fi{min-height:40px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg2);font-size:.95rem;width:100%;font-family:inherit;color:inherit}.fi:focus{border-color:var(--hot);outline:none}
.row .fi{width:auto}.grow{flex:1;min-width:120px}.w56{width:60px!important;flex:none;text-align:center}
.sb,.ib,.tabs button{background:transparent}
.sb{min-height:36px;padding:0 14px;border-radius:10px;border:2px solid var(--line);font-weight:600;font-size:.9rem;color:var(--fg)}.sb:hover{border-color:var(--mute)}.sb:disabled{opacity:.4;cursor:not-allowed}
.sb.primary{background:var(--hot)!important;border-color:var(--hot);color:#fff}.sb.danger{border-color:var(--bad);color:var(--bad)}.sb.quiet{border:0;color:var(--mute);text-align:left;padding:0}.sb.big{min-height:46px}
.back{display:none;align-self:flex-start}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--mute)}
.srow{padding:8px 6px;border-bottom:1px solid var(--line)}.srow:last-child{border:0}.srow[hidden]{display:none}
.st{min-width:0}.st b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.st small{color:var(--mute)}
.ib{width:36px;height:36px;border-radius:10px;font-size:1rem}.ib:hover{background:var(--bg2)}
.edit{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px;padding:12px;background:var(--bg);border-radius:12px}
.pv{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rhead{display:flex;justify-content:space-between;gap:8px}.dot{color:var(--mute);font-weight:700}.dot.on{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;box-shadow:0 6px 24px #0008;max-width:92vw}.toast button{margin-left:10px;font-weight:800;color:var(--hot);text-decoration:underline}
@media(max-width:760px){.split{grid-template-columns:1fr}.split.has .side{display:none}.split:not(.has) .detail{display:none}.back{display:inline-flex;align-items:center}}
</style>
<div id=main>Loading…</div>
<script type=module src="/js/admin.js"></script>
