<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Song Quiz Test Phones</title>
<link rel=icon type="image/svg+xml" href=/favicon.svg>
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap">
<link rel=stylesheet href=style.css>
<style>.sim{padding:16px;max-width:1500px;margin:auto}.sim h1{font-size:1.8rem;margin:0}.sim p{color:var(--mute);margin:.3em 0 1em;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}.grid figure{margin:0}.grid figcaption{font:800 1rem var(--display);margin-bottom:6px}
iframe{width:100%;height:78vh;min-height:620px;border:2px solid var(--line);border-radius:22px;background:var(--bg)}</style>
<div class=sim><h1>Test phones</h1>
<p>Four fake players on one screen. Keep the TV page (<a href="/?new" target=_blank style="color:var(--hot2)">open it here</a>) visible in another window, tap Start there, then: Anna creates a game, the others join, everybody picks a team (Anna and Cleo in A, Ben and Dan in B), Anna starts.</p>
<div class=grid>
<figure><figcaption>Anna (host)</figcaption><iframe data-p="Anna"></iframe></figure>
<figure><figcaption>Ben</figcaption><iframe data-p="Ben"></iframe></figure>
<figure><figcaption>Cleo</figcaption><iframe data-p="Cleo"></iframe></figure>
<figure><figcaption>Dan</figcaption><iframe data-p="Dan"></iframe></figure>
</div></div>
<script>const room=new URLSearchParams(location.search).get('room');document.querySelectorAll('iframe').forEach(f=>{f.src='/play?p='+f.dataset.p+(room?'&room='+room:'')})</script>
