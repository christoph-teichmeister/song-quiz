<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Song Quiz TV</title>
<link rel=stylesheet href=style.css>
<div id=yt></div><div id=cover style="display:none"><div class=bars><i></i><i style="animation-delay:.2s"></i><i style="animation-delay:.4s"></i><i style="animation-delay:.1s"></i><i style="animation-delay:.3s"></i></div><h1 id=cover-t></h1></div>
<div class=tv id=main></div>
<div id=prompt onclick="ws.send(JSON.stringify({tv:1}))">Still there? Resetting in <b id=pc></b> s — tap anywhere to keep playing</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $=id=>document.getElementById(id);let S=null,yt=null,ytReady=false,unlocked=false,lastIdx=-1,off=0;
const ws=new WebSocket(`ws://${location.host}`);ws.onopen=()=>ws.send(JSON.stringify({tv:1}));
ws.onmessage=e=>{const m=JSON.parse(e.data);if('state'in m){S=m.state;if(S)off=Date.now()-S.now;render();audio()}};
function onYouTubeIframeAPIReady(){yt=new YT.Player('yt',{width:320,height:200,playerVars:{playsinline:1,controls:0},events:{onReady:()=>ytReady=true}})}
const q=(url)=>`<img src="/qr?u=${encodeURIComponent(url)}" style="width:min(30vw,380px);background:#fff;border-radius:1em">`;
let base=location.origin,ssid='';const info=()=>fetch('/info').then(r=>r.json()).then(i=>{base=i.base;ssid=i.ssid});info();setInterval(info,30000);
const wifi=()=>`<p class=wifi>📶 Everyone must be on the same Wi-Fi${ssid?`: <b>${ssid}</b>`:''}</p>`;
function names(t){return S.players.filter(p=>p.team===t).map(p=>p.name+(S.teams[t].front===p.id&&S.phase!=='lobby'?' 🎤':'')).join(', ')||'–'}
function render(){
  const prompt=S&&S.promptUntil;$('prompt').style.display=prompt?'flex':'none';if(prompt)$('pc').textContent=Math.max(0,Math.ceil((S.promptUntil-(Date.now()-off))/1000));
  const cover=S&&['playing','verify','countdown'].includes(S.phase);$('cover').style.display=cover?'flex':'none';
  if(!S){$('main').innerHTML=`<div class=idle><div class=rings><i></i><i></i><i></i><span>🎵</span></div><h1>Song Quiz</h1><p>Scan to start a game</p>${q(base+'/play')}${wifi()}<div class=notes>${'♪♫♬♩'.split('').map((n,i)=>`<em style="left:${10+i*22}%;animation-delay:${i*1.3}s">${n}</em>`).join('')}</div></div>`;return}
  const sc=`<div class=row><div class=card><div class=A>Team A</div><div class=score>${S.teams.A.score}</div>${names('A')}</div><div class=card><div class=B>Team B</div><div class=score>${S.teams.B.score}</div>${names('B')}</div></div>`;
  const ph=S.phase;let h='';
  if(ph==='lobby')h=`<h1>Join with code <b>${S.code}</b></h1>${q(base+'/play?code='+S.code)}${sc}<p>Host picks the list and starts.</p>${wifi()}`;
  else if(ph==='pickfront')h=`<h1>Song ${S.idx+1}/${S.total}: pick your front-person</h1>${sc}<p>🎤 Front-persons tap Ready on their phone.</p>`;
  else if(ph==='countdown')h=`<div class=big>${Math.max(1,Math.ceil((S.until-(Date.now()-off))/1000))}</div>`;
  else if(ph==='playing'){h='';$('cover-t').textContent=`Song ${S.idx+1}/${S.total}${S.locked.length?' — '+S.locked.join(',')+' locked':''}`}
  else if(ph==='verify'){h='';$('cover-t').innerHTML=`<span class=${S.buzz.team}>Team ${S.buzz.team}</span> buzzed!`}
  else if(ph==='reveal')h=`<h1>${S.answer.title}</h1><h2>${S.answer.artist}</h2>${S.lastResult?`<p>Team ${S.lastResult.team}: +${S.lastResult.pts}</p>`:''}${sc}`;
  else if(ph==='end'){const w=S.teams.A.score===S.teams.B.score?'Draw!':'Team '+(S.teams.A.score>S.teams.B.score?'A':'B')+' wins!';h=`<h1>${w}</h1>${sc}`}
  $('main').innerHTML=(unlocked?'':'<button onclick="unlock()">🔊 Enable sound (click once)</button>')+h;
}
function unlock(){unlocked=true;render();if(ytReady){yt.mute();yt.playVideo();yt.pauseVideo();yt.unMute()}}
function audio(){if(!ytReady||!S)return;const p=S.phase;
  if(p==='playing'){if(S.idx!==lastIdx||!yt.getVideoData?.().video_id){lastIdx=S.idx;yt.loadVideoById(S.videoId)}else yt.playVideo()}
  else if(p==='verify'||(p==='reveal'&&S.settings.mode==='intro'))yt.pauseVideo();
  else if(p==='lobby'||p==='end'||p==='pickfront'){yt.stopVideo();lastIdx=-1}}
setInterval(render,500);
</script>
